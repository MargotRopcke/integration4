<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Drawing</title>
    <style>
        /* Screen styles */
        body {
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #f5f5f5;
            font-family: sans-serif;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        #drawing {
            max-width: 100%;
            height: auto;
            /* Checkerboard pattern to show transparency on screen */
            background-image:
                linear-gradient(45deg, #ccc 25%, transparent 25%),
                linear-gradient(-45deg, #ccc 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #ccc 75%),
                linear-gradient(-45deg, transparent 75%, #ccc 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            border: 1px solid #ddd;
        }

        .actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .actions button {
            padding: 10px 24px;
            font-size: 16px;
            cursor: pointer;
            border: 1px solid #333;
            background: #fff;
            border-radius: 4px;
        }

        .actions button:hover {
            background: #333;
            color: #fff;
        }

        #no-image {
            color: #999;
            font-style: italic;
        }

        /* Print styles – only the image, no background, no UI */
        @media print {
            body {
                background: none;
                padding: 0;
                margin: 0;
            }

            h1,
            .actions,
            #no-image {
                display: none !important;
            }

            #drawing {
                background-image: none !important;
                border: none !important;
                max-width: 100%;
            }
        }
    </style>
</head>

<body>
    <h1>Your Drawing</h1>
    <img id="drawing" alt="Your drawing" />
    <p id="no-image" style="display:none;">No drawing found. Please go back and save your drawing first.</p>

    <div class="actions">
        <button id="printBtn">🖨️ Print</button>
        <button id="downloadBtn">💾 Download PNG</button>
        <button id="backBtn">← Go Back</button>
    </div>

    <script>
        const drawingImg = document.getElementById('drawing');
        const noImageMsg = document.getElementById('no-image');
        const printBtn = document.getElementById('printBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const backBtn = document.getElementById('backBtn');

        // Get the drawing data from localStorage
        const imageData = localStorage.getItem('drawingImage');

        if (imageData) {
            drawingImg.src = imageData;
            drawingImg.style.display = 'block';
        } else {
            drawingImg.style.display = 'none';
            noImageMsg.style.display = 'block';
        }

        // Print button – triggers the browser print dialog
        printBtn.addEventListener('click', () => {
            window.print();
        });

        // Download button – saves the PNG locally
        downloadBtn.addEventListener('click', () => {
            if (!imageData) return;
            const link = document.createElement('a');
            link.download = 'my-drawing.png';
            link.href = imageData;
            link.click();
        });

        // Back button
        backBtn.addEventListener('click', () => {
            window.history.back();
        });

        // Optional: auto-print when the page loads (uncomment if you want this)
        // window.addEventListener('load', () => {
        //     if (imageData) window.print();
        // });
    </script>
</body>

</html>
